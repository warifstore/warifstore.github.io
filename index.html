<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متجر وارف</title>
<meta name="description" content="متجر وارف — تصفّحي القطع الحالية واطلبي عبر الرسائل الخاصة.">

<!-- =====================================================================
     الإعدادات — عدّلي هذين السطرين فقط، لا حاجة للمس أي شيء آخر.
     ===================================================================== -->
<script>
  // ١) رابط شيت Google Sheets بصيغة CSV. اتركيه فارغًا "" لعرض أمثلة مؤقتة.
  const PRODUCTS_CSV_URL = "https://docs.google.com/spreadsheets/d/1p72LEnymJdVM3Vy_-LrBDQUYaGOc-Gt0qkLU4ErPHW0/gviz/tq?tqx=out:csv&gid=0";

  // ٢) حساب انستغرام الخاص بالمتجر (بدون @).
  const INSTAGRAM_HANDLE = "warifstore";
</script>
<!-- ===================================================================== -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;500;600;700&amp;family=Tajawal:wght@400;500;700&amp;display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
  :root{
    --ink: #3B0F2E;
    --ink-soft: #52173F;
    --blush: #FDF1F5;
    --blush-dim: #F6DCE6;
    --magenta: #D6336C;
    --magenta-bright: #E8578C;
    --berry: #9C3D63;
    --ivory: #FFF8FA;
    --rose: #C24E78;
    --sage: #748C7B;
    --paper: #FFFFFF;
    --line: rgba(59,15,46,0.14);
    --line-dark: rgba(255,248,250,0.18);
    --shadow: 0 18px 42px rgba(59,15,46,0.11);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--blush);
    color:var(--ink);
    font-family:'Tajawal',sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  a{color:inherit;}
  img{max-width:100%;}

  .label{
    font-family:'Tajawal',sans-serif;
    font-weight:700;
    font-size:0.78rem;
    letter-spacing:0.02em;
  }

  /* ---------- الغلاف ---------- */
  .hero{
    min-height:82vh;
    background:
      linear-gradient(90deg, rgba(59,15,46,0.94) 0%, rgba(59,15,46,0.82) 43%, rgba(59,15,46,0.34) 100%),
      url("https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=1800&q=80&auto=format&fit=crop") center/cover;
    color:var(--ivory);
    padding:5.5rem 6vw 4rem;
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
  }
  .hero__inner{width:min(1120px, 100%); margin-inline:auto;}
  .hero__eyebrow{
    color:var(--magenta-bright);
    margin-bottom:1.4rem;
    display:flex;
    align-items:center;
    gap:0.6rem;
  }
  .hero__eyebrow::before{
    content:"";
    width:22px;
    height:1px;
    background:var(--magenta-bright);
    display:inline-block;
  }
  .hero h1{
    font-family:'El Messiri',serif;
    font-weight:600;
    font-size:4.8rem;
    line-height:1.15;
    margin:0 0 1.6rem;
    max-width:16ch;
  }
  .hero p{
    font-size:1.05rem;
    line-height:1.85;
    max-width:40ch;
    color:rgba(255,248,250,0.78);
    margin:0 0 2.2rem;
  }
  .hero__cta{
    display:inline-flex;
    align-items:center;
    gap:0.6rem;
    background:var(--ivory);
    color:var(--ink);
    padding:0.9rem 1.7rem;
    border-radius:999px;
    text-decoration:none;
    font-weight:700;
    font-size:0.92rem;
    border:1px solid rgba(255,248,250,0.55);
    box-shadow:0 16px 32px rgba(0,0,0,0.18);
    transition:background .2s ease, color .2s ease, transform .2s ease;
  }
  .hero__cta:hover{background:var(--magenta-bright); color:var(--ivory); transform:translateY(-1px);}
  .hero__meta{
    display:flex;
    flex-wrap:wrap;
    gap:0.7rem;
    margin-top:2.1rem;
  }
  .hero__meta span{
    border:1px solid var(--line-dark);
    border-radius:999px;
    color:rgba(255,248,250,0.78);
    padding:0.45rem 0.8rem;
    font-size:0.8rem;
  }

  /* ---------- المتجر ---------- */
  .shop{
    padding:4.5rem 6vw 6rem;
    width:min(1180px, 100%);
    margin-inline:auto;
  }
  .shop__head{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:1rem;
    margin-bottom:1rem;
    border-bottom:1px solid var(--line);
    padding-bottom:1.4rem;
  }
  .shop__head h2{
    font-family:'El Messiri',serif;
    font-weight:600;
    font-size:2rem;
    margin:0;
  }
  .shop__count{
    color:var(--berry);
    background:rgba(255,255,255,0.58);
    border:1px solid var(--line);
    border-radius:999px;
    padding:0.42rem 0.78rem;
  }

  .demo-banner{
    background:rgba(255,255,255,0.62);
    border:1px dashed rgba(214,51,108,0.56);
    color:var(--berry);
    padding:0.85rem 1.1rem;
    border-radius:8px;
    font-size:0.85rem;
    line-height:1.7;
    margin-bottom:2.4rem;
  }
  .demo-banner strong{color:var(--ink);}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(245px, 1fr));
    gap:2.6rem 1.8rem;
  }

  .card{
    position:relative;
    min-width:0;
  }
  .card__frame{
    position:relative;
    aspect-ratio:4/5;
    background:var(--blush-dim);
    border:1px solid var(--line);
    overflow:hidden;
    border-radius:6px;
    box-shadow:var(--shadow);
  }
  .card__frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform .5s ease;
  }
  .card:hover .card__frame img{transform:scale(1.035);}
  .card__placeholder{
    width:100%;
    height:100%;
    display:grid;
    place-items:center;
    padding:1.5rem;
    background:
      linear-gradient(135deg, rgba(255,248,250,0.72), rgba(246,220,230,0.92)),
      repeating-linear-gradient(-45deg, rgba(214,51,108,0.08) 0 1px, transparent 1px 14px);
    color:var(--berry);
    font-family:'El Messiri',serif;
    font-size:1.15rem;
    text-align:center;
  }

  .tag{
    position:absolute;
    top:14px;
    inset-inline-start:-6px;
    background:var(--ink);
    color:var(--magenta-bright);
    padding:0.32rem 0.75rem;
    font-family:'Tajawal',sans-serif;
    font-weight:700;
    font-size:0.72rem;
    transform:rotate(2deg);
    box-shadow:0 3px 8px rgba(59,15,46,0.3);
    border-radius:3px;
  }

  .card__body{padding:1rem 0.1rem 0;}
  .card__top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:0.8rem;
    margin-bottom:0.55rem;
  }
  .card__name{
    font-family:'El Messiri',serif;
    font-size:1.2rem;
    font-weight:600;
    line-height:1.45;
    min-width:0;
    margin:0;
  }
  .card__note{
    font-weight:700;
    color:var(--sage);
    white-space:nowrap;
    font-size:0.78rem;
    border:1px solid rgba(116,140,123,0.3);
    background:rgba(255,255,255,0.6);
    border-radius:999px;
    padding:0.24rem 0.58rem;
  }
  .card__desc{
    font-size:0.9rem;
    line-height:1.7;
    color:rgba(59,15,46,0.68);
    margin:0 0 1rem;
  }
  .card__cta{
    display:inline-flex;
    align-items:center;
    gap:0.5rem;
    background:var(--magenta);
    color:var(--ivory);
    text-decoration:none;
    padding:0.62rem 1.2rem;
    border-radius:999px;
    font-size:0.82rem;
    font-weight:700;
    min-height:42px;
    transition:background .2s ease, transform .2s ease;
  }
  .card__cta:hover{background:var(--ink); transform:translateY(-1px);}

  /* ---------- حالات فارغة ---------- */
  .state{
    grid-column:1/-1;
    border:1px dashed var(--line);
    padding:3.2rem 2rem;
    text-align:center;
    color:rgba(59,15,46,0.6);
    border-radius:8px;
    background:rgba(255,255,255,0.5);
  }
  .state strong{display:block; font-family:'El Messiri',serif; font-size:1.2rem; color:var(--ink); margin-bottom:0.5rem; font-weight:600;}
  .state code{
    background:var(--blush-dim);
    padding:0.15rem 0.4rem;
    border-radius:3px;
    font-size:0.85em;
    direction:ltr;
    display:inline-block;
  }

  /* ---------- التذييل ---------- */
  footer{
    background:var(--ink);
    color:rgba(255,248,250,0.65);
    padding:2.4rem 6vw;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:1rem;
    font-size:0.88rem;
  }
  footer a{
    color:var(--magenta-bright);
    text-decoration:none;
    font-weight:700;
  }
  footer a:hover{text-decoration:underline;}

  @media (max-width:640px){
    .hero{
      min-height:76vh;
      padding:3.6rem 6vw 3rem;
      background:
        linear-gradient(180deg, rgba(59,15,46,0.94) 0%, rgba(59,15,46,0.72) 68%, rgba(59,15,46,0.38) 100%),
        url("https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=1000&q=80&auto=format&fit=crop") center/cover;
    }
    .hero h1{font-size:3.1rem;}
    .shop{padding:3rem 6vw 4rem;}
    .shop__head{flex-direction:column; align-items:flex-start; gap:0.4rem;}
    .grid{grid-template-columns:1fr; gap:2.1rem;}
    .card__top{flex-direction:column; gap:0.45rem;}
  }

  @media (min-width:641px) and (max-width:980px){
    .hero h1{font-size:4rem;}
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
    html{scroll-behavior:auto;}
  }

  :focus-visible{
    outline:2px solid var(--magenta);
    outline-offset:2px;
  }
</style>
</head>
<body>

  <section class="hero">
    <div class="hero__inner">
      <span class="hero__eyebrow label">متجر وارف</span>
      <h1>قطع تستاهل تسألي عنها.</h1>
      <p>تشكيلة صغيرة ومتجددة من الأزياء والإكسسوارات. بدون سلة أو دفع إلكتروني — إذا عجبك شيء، ارسلي رسالة وحنا نكمل الباقي.</p>
      <a class="hero__cta" href="#shop">شوفي القطع الحالية ↓</a>
      <div class="hero__meta" aria-label="مزايا متجر وارف">
        <span>طلبات عبر الرسائل</span>
        <span>تحديثات من الشيت</span>
        <span>السعر عند التواصل</span>
      </div>
    </div>
  </section>

  <section class="shop" id="shop">
    <div class="shop__head">
      <h2>القطع الحالية</h2>
      <span class="shop__count label" id="itemCount"></span>
    </div>
    <div id="demoBanner"></div>
    <div class="grid" id="grid">
      <div class="state">
        <strong>جاري التحميل…</strong>
        لحظة وحدة بس.
      </div>
    </div>
  </section>

  <footer>
    <span>متجر وارف</span>
    <a href="https://instagram.com/warifstore" id="igFooterLink" target="_blank" rel="noopener">انستغرام ↗</a>
  </footer>

<script>
  const grid = document.getElementById('grid');
  const itemCount = document.getElementById('itemCount');
  const demoBanner = document.getElementById('demoBanner');
  const igFooterLink = document.getElementById('igFooterLink');
  const cleanHandle = INSTAGRAM_HANDLE.replace(/^@/, '').trim();
  igFooterLink.href = `https://instagram.com/${encodeURIComponent(cleanHandle)}`;
  igFooterLink.textContent = `@${cleanHandle} ↗`;

  // أمثلة توضيحية تظهر إلى أن يتم ربط شيت المنتجات الحقيقي
  const DEMO_PRODUCTS = [
    {
      name: "توب كتان أوفرسايز",
      image: "https://images.unsplash.com/photo-1551803091-e20673f15770?w=800&q=80",
      description: "قصة واسعة مريحة، قماش كتان طبيعي بلون وردي فاتح."
    },
    {
      name: "حقيبة يد منسوجة",
      image: "https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=800&q=80",
      description: "شغل يدوي منسوج، مقاس متوسط يناسب الاستخدام اليومي."
    },
    {
      name: "أقراط دائرية ذهبية",
      image: "https://images.unsplash.com/photo-1535632066927-ab7c9ab60908?w=800&q=80",
      description: "تصميم بسيط وأنيق، مناسبة للإطلالات اليومية والسهرات."
    },
    {
      name: "وشاح حرير وردي",
      image: "https://images.unsplash.com/photo-1601924994987-69e26d50dc26?w=800&q=80",
      description: "خامة حرير ناعمة، يعطي لمسة أنيقة لأي إطلالة."
    }
  ];

  function dmLink(){
    return `https://ig.me/m/${encodeURIComponent(cleanHandle)}`;
  }

  function normalizeImageUrl(value){
    const url = (value || '').trim();
    if(!url) return '';

    const driveMatch = url.match(/drive\.google\.com\/file\/d\/([^/]+)/);
    if(driveMatch){
      return `https://drive.google.com/uc?export=view&id=${driveMatch[1]}`;
    }

    return url;
  }

  function googleSheetJsonpUrl(sourceUrl, callbackName){
    const idMatch = sourceUrl.match(/spreadsheets\/d\/([^/]+)/);
    if(!idMatch) return '';

    const gidMatch = sourceUrl.match(/[?&#]gid=([^&#]+)/);
    const gid = gidMatch ? gidMatch[1] : '0';
    return `https://docs.google.com/spreadsheets/d/${idMatch[1]}/gviz/tq?tqx=out:json;responseHandler:${callbackName}&gid=${encodeURIComponent(gid)}`;
  }

  function gvizTableToRows(payload){
    const table = payload && payload.table;
    const rawRows = table && table.rows ? table.rows.map(row => {
      return (row.c || []).map(cell => cell ? String(cell.v ?? cell.f ?? '').trim() : '');
    }) : [];

    if(!rawRows.length) return [];

    let headers = (table.cols || []).map(col => String(col.label || '').trim().toLowerCase());
    let dataRows = rawRows;

    if(!headers.some(Boolean)){
      headers = rawRows[0].map(value => value.trim().toLowerCase());
      dataRows = rawRows.slice(1);
    }

    return dataRows.map(cells => {
      return headers.reduce((row, header, index) => {
        if(header) row[header] = cells[index] || '';
        return row;
      }, {});
    });
  }

  function loadGoogleSheetRows(sourceUrl){
    return new Promise((resolve, reject) => {
      const callbackName = `warifSheet_${Date.now()}_${Math.floor(Math.random() * 100000)}`;
      const scriptUrl = googleSheetJsonpUrl(sourceUrl, callbackName);

      if(!scriptUrl){
        reject(new Error('Not a Google Sheets URL'));
        return;
      }

      const script = document.createElement('script');
      const timeout = window.setTimeout(() => {
        cleanup();
        reject(new Error('Google Sheets request timed out'));
      }, 12000);

      function cleanup(){
        window.clearTimeout(timeout);
        delete window[callbackName];
        script.remove();
      }

      window[callbackName] = payload => {
        cleanup();
        if(!payload || payload.status !== 'ok'){
          reject(new Error('Google Sheets returned an error'));
          return;
        }
        resolve(gvizTableToRows(payload));
      };

      script.onerror = () => {
        cleanup();
        reject(new Error('Google Sheets script failed to load'));
      };

      script.src = scriptUrl;
      document.head.append(script);
    });
  }

  function setState(title, message){
    grid.innerHTML = '';
    const state = document.createElement('div');
    state.className = 'state';
    const strong = document.createElement('strong');
    strong.textContent = title;
    state.append(strong, message);
    grid.append(state);
    itemCount.textContent = '';
  }

  function setDemoBanner(isDemo){
    demoBanner.replaceChildren();
    if(!isDemo) return;

    const banner = document.createElement('div');
    banner.className = 'demo-banner';

    const strong = document.createElement('strong');
    strong.textContent = 'هذه أمثلة توضيحية فقط.';

    banner.append(strong, ' اربطي شيت Google Sheets الخاص بك (راجعي README.md) وسيتم استبدالها بمنتجاتك الحقيقية تلقائيًا.');
    demoBanner.append(banner);
  }

  function createProductCard(product, index){
    const card = document.createElement('article');
    card.className = 'card';

    const frame = document.createElement('div');
    frame.className = 'card__frame';

    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = `رقم ${index + 1}`;

    if(product.image){
      const image = document.createElement('img');
      image.src = product.image;
      image.alt = product.name;
      image.loading = 'lazy';
      image.addEventListener('error', () => {
        image.replaceWith(createImagePlaceholder());
      }, { once: true });
      frame.append(tag, image);
    } else {
      frame.append(tag, createImagePlaceholder());
    }

    const body = document.createElement('div');
    body.className = 'card__body';

    const top = document.createElement('div');
    top.className = 'card__top';

    const name = document.createElement('h3');
    name.className = 'card__name';
    name.textContent = product.name;

    const note = document.createElement('span');
    note.className = 'card__note';
    note.textContent = 'السعر عند التواصل';

    top.append(name, note);
    body.append(top);

    if(product.description){
      const description = document.createElement('p');
      description.className = 'card__desc';
      description.textContent = product.description;
      body.append(description);
    }

    const cta = document.createElement('a');
    cta.className = 'card__cta';
    cta.href = dmLink();
    cta.target = '_blank';
    cta.rel = 'noopener';
    cta.textContent = 'اطلبي عبر الرسائل ←';
    body.append(cta);

    card.append(frame, body);
    return card;
  }

  function createImagePlaceholder(){
    const placeholder = document.createElement('div');
    placeholder.className = 'card__placeholder';
    placeholder.textContent = 'الصورة قريبًا';
    return placeholder;
  }

  function renderProducts(rows, isDemo){
    const products = rows
      .map(r => ({
        name: (r.name || '').trim(),
        image: normalizeImageUrl(r.image),
        description: (r.description || '').trim(),
      }))
      .filter(p => p.name);

    if(!products.length){
      setState('لا توجد منتجات مربوطة بعد', 'تأكدي أن الشيت يحتوي على أعمدة name و image و description وفيه صف واحد على الأقل.');
      setDemoBanner(false);
      return;
    }

    itemCount.textContent = `${products.length} قطعة`;
    setDemoBanner(isDemo);

    grid.innerHTML = '';
    products.forEach((product, index) => {
      grid.append(createProductCard(product, index));
    });
  }

  if(!PRODUCTS_CSV_URL){
    renderProducts(DEMO_PRODUCTS, true);
  } else if(PRODUCTS_CSV_URL.includes('docs.google.com/spreadsheets/d/')) {
    loadGoogleSheetRows(PRODUCTS_CSV_URL)
      .then(rows => renderProducts(rows, false))
      .catch(() => {
        setState('تعذّر تحميل المنتجات', 'تأكدي أن الشيت متاح للرابط وأن الأعمدة مكتوبة بالإنجليزية: name و image و description.');
      });
  } else {
    Papa.parse(PRODUCTS_CSV_URL, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: (results) => renderProducts(results.data, false),
      error: () => {
        setState('تعذّر تحميل المنتجات', 'تأكدي أن الشيت متاح للرابط وأن الأعمدة مكتوبة بالإنجليزية: name و image و description.');
      },
    });
  }
</script>

</body>
</html>
